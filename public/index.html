<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoQuery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 화면 1: 프로젝트 목록 -->
  <section id="projects-view" class="view active">
    <header class="top-bar">
      <h1>VideoQuery</h1>
      <button id="btn-new-project" class="btn btn-primary">+ 새 프로젝트</button>
    </header>
    <div id="projects-grid" class="projects-grid"></div>
  </section>

  <!-- 화면 2: 워크스페이스 -->
  <section id="workspace-view" class="view">
    <header class="top-bar">
      <button id="btn-back" class="btn btn-ghost">&larr; 프로젝트 목록</button>
      <h2 id="workspace-title"></h2>
      <button id="btn-add-video" class="btn btn-primary">+ 영상 추가</button>
    </header>
    <div class="workspace-layout">
      <aside id="video-sidebar" class="sidebar">
        <h3>영상 목록 <span id="video-count"></span></h3>
        <ul id="video-list"></ul>
        <div id="video-pagination" class="pagination"></div>
      </aside>
      <div id="sidebar-resizer" class="sidebar-resizer"></div>
      <main class="main-content">
        <div class="main-tabs">
          <button id="tab-search" class="main-tab active">검색</button>
          <button id="tab-analyze" class="main-tab">분석</button>
        </div>
        <div id="panel-search" class="tab-panel active">
          <div class="query-bar">
            <input type="text" id="search-input" placeholder="검색할 장면을 설명하세요...">
            <button id="btn-search" class="btn btn-primary">검색</button>
          </div>
          <div id="search-results" class="results-area">
            <p class="placeholder-text">프로젝트 내 영상에서 장면을 검색합니다.</p>
          </div>
        </div>
        <div id="panel-analyze" class="tab-panel">
          <div class="analyze-header">
            <div class="analyze-thumb" id="analyze-thumb">
              <div class="analyze-thumb-placeholder"></div>
            </div>
            <span class="analyze-video-name" id="analyze-video-name">사이드바에서 영상을 선택하세요</span>
          </div>
          <div class="query-bar">
            <input type="text" id="analyze-input" placeholder="사이드바에서 영상을 선택하세요..." disabled>
            <button id="btn-analyze" class="btn btn-primary" disabled>분석</button>
          </div>
          <div id="analyze-results" class="results-area">
            <p class="placeholder-text">사이드바에서 영상을 선택한 뒤 질문하세요.</p>
          </div>
        </div>
      </main>
    </div>
  </section>

  <!-- 모달: 새 프로젝트 -->
  <div id="modal-new-project" class="modal-overlay hidden">
    <div class="modal">
      <h3>새 프로젝트 생성</h3>
      <input type="text" id="input-project-name" placeholder="프로젝트 이름">
      <div class="modal-actions">
        <button class="btn btn-ghost modal-cancel">취소</button>
        <button id="btn-create-project" class="btn btn-primary">생성</button>
      </div>
    </div>
  </div>

  <!-- 모달: 영상 추가 -->
  <div id="modal-add-video" class="modal-overlay hidden">
    <div class="modal">
      <h3>영상 추가</h3>
      <div class="upload-tabs">
        <button id="tab-url" class="upload-tab active">URL</button>
        <button id="tab-file" class="upload-tab">파일</button>
      </div>
      <div id="upload-panel-url" class="upload-panel">
        <input type="text" id="input-video-url" placeholder="공개 영상 URL">
        <input type="text" id="input-video-title" placeholder="제목 (선택)">
      </div>
      <div id="upload-panel-file" class="upload-panel hidden">
        <label class="file-drop-area" id="file-drop-area">
          <input type="file" id="input-video-file" accept="video/*,audio/*">
          <span class="file-drop-text">클릭하거나 파일을 드래그하세요</span>
          <span class="file-drop-name" id="file-drop-name"></span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost modal-cancel">취소</button>
        <button id="btn-upload-video" class="btn btn-primary">추가</button>
      </div>
    </div>
  </div>

  <!-- 모달: 삭제 확인 -->
  <div id="modal-delete" class="modal-overlay hidden">
    <div class="modal">
      <h3>영상 삭제</h3>
      <p>이 영상을 삭제하시겠습니까? 되돌릴 수 없습니다.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost modal-cancel">취소</button>
        <button id="btn-confirm-delete" class="btn btn-danger">삭제</button>
      </div>
    </div>
  </div>

  <!-- 모달: 영상 미리보기 -->
  <div id="modal-video-preview" class="modal-overlay hidden">
    <div class="modal modal-video">
      <div class="modal-video-header">
        <h3 id="modal-video-title"></h3>
        <button class="btn-close-modal" id="btn-close-video-preview">&times;</button>
      </div>
      <div id="modal-video-body" class="modal-video-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
